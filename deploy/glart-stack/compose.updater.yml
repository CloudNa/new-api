services:
  glart-stack-updater:
    build:
      context: ./updater
    image: glart/stack-updater:clean
    container_name: glart-stack-updater
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      GLART_STACK_UPDATER_TOKEN: ${GLART_STACK_UPDATER_TOKEN}
      GLART_STACK_ROOT: /workspace
      GLART_STACK_COMPOSE_DIR: /workspace/deploy/glart-stack
      GLART_STACK_COMPOSE_FILE: compose.yml
      GLART_STACK_CLEANUP_KEEP_ROLLBACK_IMAGES: ${GLART_STACK_CLEANUP_KEEP_ROLLBACK_IMAGES:-5}
      GLART_STACK_CLEANUP_KEEP_BACKUPS: ${GLART_STACK_CLEANUP_KEEP_BACKUPS:-5}
      GLART_STACK_CLEANUP_BUILD_CACHE_MAX_AGE_HOURS: ${GLART_STACK_CLEANUP_BUILD_CACHE_MAX_AGE_HOURS:-168}
    volumes:
      - ../..:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
    expose:
      - "8787"
    networks:
      - glart-internal

networks:
  glart-internal:
    external: true
